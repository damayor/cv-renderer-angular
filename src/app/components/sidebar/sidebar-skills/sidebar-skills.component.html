<ng-container>
  <div i18n="@@skillsTitle" class="sidebar-heading">SKILLS</div>
  @for (group of skillGroups; track group[0]) {
    <div class="my-3">
      <div class="flex flex-wrap items-center w-full relative p-0 m-0">
        <span class="text-xs font-normal uppercase text-primary mb-1 pr-1">{{ group[0] }}</span>
        @for (skill of group[1]; track skill) {
          <div class="relative block cursor-default break-inside-auto">
            <div style="color: var(--clr-gray-900)" class="inline-block before:content-['•'] before:mr-1 before:text-primary w-fit text-xs font-thin uppercase bg-pr  pr-1 py-1 mb-1">{{ skill }}</div>
          </div>
        }
      </div>
    </div>
  }
</ng-container>
